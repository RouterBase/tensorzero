# TensorZero — KIE All Models
#
# LLM models via OpenAI-compatible endpoint:
#   POST /openai/v1/chat/completions
#   { "model": "tensorzero::model_name::<model-name>", ... }
#
# Media generation via TensorZero inference endpoint:
#   POST /inference
#   { "function_name": "video_generate", "variant_name": "kling_2_1",
#     "input": { "messages": [{ "role": "user", "content": "A cat playing piano" }] },
#     "params": { "media_generation": { "callback_url": "https://...", "extra": {"aspect_ratio":"16:9","duration":"5"} } } }
#
# ── LLM Chat-Completion Models ────────────────────────────────────────────────

[models."gemini-3-pro"]
routing = ["kie"]

[models."gemini-3-pro".providers.kie]
type = "kie"
model_name = "gemini-3-pro"

[models."gemini-3-flash"]
routing = ["kie"]

[models."gemini-3-flash".providers.kie]
type = "kie"
model_name = "gemini-3-flash"

[models."gemini-2.5-pro"]
routing = ["kie"]

[models."gemini-2.5-pro".providers.kie]
type = "kie"
model_name = "gemini-2.5-pro"

[models."gemini-2.5-flash"]
routing = ["kie"]

[models."gemini-2.5-flash".providers.kie]
type = "kie"
model_name = "gemini-2.5-flash"

[models."gpt-5-2"]
routing = ["kie"]

[models."gpt-5-2".providers.kie]
type = "kie"
model_name = "gpt-5-2"

[models."claude-sonnet-4-5"]
routing = ["kie"]

[models."claude-sonnet-4-5".providers.kie]
type = "kie"
model_name = "claude-sonnet-4-5"

[models."claude-opus-4-5"]
routing = ["kie"]

[models."claude-opus-4-5".providers.kie]
type = "kie"
model_name = "claude-opus-4-5"

# ── Video Generation Functions ────────────────────────────────────────────────
#
# Each function maps to one KIE video model via a kie_media variant.
# Callers SHOULD pass extra params via params.media_generation.extra:
#   - Kling models: {"aspect_ratio": "16:9", "duration": "5"}
#   - Seedance models: (check KIE docs for required fields)
#   - Wan models: works with just prompt

[functions.video_generate]
type = "chat"

# ByteDance Seedance
[functions.video_generate.variants.seedance_1_5_pro]
type = "kie_media"
model = "bytedance/seedance-1.5-pro"
tags = ["video", "generation", "text-to-video"]

# Kling models (require aspect_ratio + duration in extra params)
[functions.video_generate.variants.kling_2_6]
type = "kie_media"
model = "kling-2.6/text-to-video"
tags = ["video", "generation", "text-to-video"]

[functions.video_generate.variants.kling_2_1_master]
type = "kie_media"
model = "kling/v2-1-master-text-to-video"
tags = ["video", "generation", "text-to-video"]

# Wan models (work with just prompt, no extra params required)
[functions.video_generate.variants.wan_2_6]
type = "kie_media"
model = "wan/2-6-text-to-video"
tags = ["video", "generation", "text-to-video"]

[functions.video_generate.variants.wan_2_2_turbo]
type = "kie_media"
model = "wan/2-2-a14b-text-to-video-turbo"
tags = ["video", "generation", "text-to-video"]

# ── Image Generation Functions ────────────────────────────────────────────────

[functions.image_generate]
type = "chat"

# Google Imagen (work with just prompt)
[functions.image_generate.variants.imagen_4]
type = "kie_media"
model = "google/imagen4"
tags = ["image", "generation", "text-to-image"]

[functions.image_generate.variants.imagen_4_ultra]
type = "kie_media"
model = "google/imagen4-ultra"
tags = ["image", "generation", "text-to-image"]

[functions.image_generate.variants.imagen_4_fast]
type = "kie_media"
model = "google/imagen4-fast"
tags = ["image", "generation", "text-to-image"]

# ByteDance SeedDream (works with just prompt)
[functions.image_generate.variants.seedream_v4]
type = "kie_media"
model = "bytedance/seedream-v4-text-to-image"
tags = ["image", "generation", "text-to-image"]

# Flux models (require resolution in extra params, e.g. {"resolution": "1024x1024"})
[functions.image_generate.variants.flux_2_pro]
type = "kie_media"
model = "flux-2/pro-text-to-image"
tags = ["image", "generation", "text-to-image"]

[functions.image_generate.variants.flux_2_flex]
type = "kie_media"
model = "flux-2/flex-text-to-image"
tags = ["image", "generation", "text-to-image"]

# ── Gateway & Storage ─────────────────────────────────────────────────────────

[gateway]
fetch_and_encode_input_files_before_inference = true
auth.enabled = true

[object_storage]
type = "s3_compatible"
endpoint = "http://minio:9000"
bucket_name = "kie-e2e-tests"
# IMPORTANT: for production environments, remove allow_http and use secure auth.
allow_http = true
