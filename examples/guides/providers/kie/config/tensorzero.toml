model = "kie::gemini-2.5-pro"

# ── Data Extraction ──
[functions.extract_data]
type = "chat"

[functions.extract_data.variants.kie_multimodal]
type = "chat_completion"
model = "kie::gemini-2.5-pro"

# ── Gateway & Storage ─────────────────────────────────────────────────────────

[gateway]
fetch_and_encode_input_files_before_inference = true
auth.enabled = true

[object_storage]
type = "s3_compatible"
endpoint = "http://minio:9000"
bucket_name = "kie-e2e-tests"
# IMPORTANT: for production environments, remove allow_http and use secure auth.
allow_http = true
